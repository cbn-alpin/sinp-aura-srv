# Configuration liée à la page d’accueil
[HOME]
TITLE = "GeoNature - SINP AURA"
INTRODUCTION = '''
<p>
  Biodiv'AURA Expert est <strong>la plateforme régionale du SINP en Auvergne-Rhône-Alpes</strong>.
  Ce portail est dédié aux utilisateurs expérimentés (services de l’Etat, collectivités, associations, bureaux d’étude, etc.).
  En facilitant l’accès à l’information, <strong>Biodiv’AURA Expert a pour objectif la connaissance et la conservation du patrimoine naturel régional</strong>.
  C’est un outil public et collectif au service de la prise en compte de la biodiversité, financé et piloté de façon partenariale.
</p>

<p>
  Les données mises à disposition ont été collectées par le réseau des partenaires des Pôles thématiques d’Auvergne-Rhône-Alpes.
  Elles s’enrichissent de jour en jour mais <strong>ne peuvent être considérées comme exhaustives</strong> et nécessitent la consultation d’autres sources, une réactualisation et des inventaires complémentaires dans le cadre de l’expertise.
</p>

<p>
  Les données de Biodiv’AURA Expert sont librement consultables à la précision maximale connue, <strong>sauf pour les données sensibles</strong>.
  En effet, <a href="https://www.biodiversite-auvergne-rhone-alpes.fr/documents/acces-aux-donnees-sensibles-du-sinp-auvergne-rhone-alpes" target="_blank">les données sensibles</a> au titre de l’article L.124-4 du code de l’environnement tiennent lieu d’exception à la diffusion publique des données (publication en ligne et téléchargement).
  Il s’agit des données de localisation ne devant pas être largement diffusées pour éviter de porter atteinte aux éléments qu’elles concernent.
</p>

<p>
  Dans le cadre de l’Observatoire Régional de la Biodiversité, les Pôles thématiques sont là pour vous accompagner techniquement et scientifiquement, selon leurs domaines de compétences.
</p>

<p>
  Pour en savoir plus sur l’ORB, les Pôles thématiques ou encore sur la mutualisation des données, rendez-vous sur <a href="https://www.biodiversite-auvergne-rhone-alpes.fr/" target="_blank">le portail internet de l’Observatoire Régional de la Biodiversité</a>.
</p>

<p>
  La plateforme Biodiv'AURA Expert s'appuie sur les technologies <a href="https://geonature.fr/" target="_blank">GeoNature</a> pour proposer un outil en amélioration continue.
  Afin de vous orienter dans la prise en main des fonctionnalités de Biodiv'AURA Expert, nous vous invitons à <a href="https://www.biodiversite-auvergne-rhone-alpes.fr/foire-aux-questions" target="_blank">consulter la Foire Aux Questions</a>.
</p>
'''
