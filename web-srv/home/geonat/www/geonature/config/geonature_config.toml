        { prop = "lb_nom", name = "Taxon" },
        { prop = "date_min", name = "Date début" },
        { prop = "observers", name = "Observateurs" },
        { prop = "dataset_name", name = "Jeu de données" }
    ]
    # Affiche (=true) ou masque (=false) l'arbre de recherche taxonomique
