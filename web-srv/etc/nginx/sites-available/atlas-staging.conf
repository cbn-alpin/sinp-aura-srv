server {
    listen 443 ssl http2; # managed by Certbot
    listen [::]:443 ssl http2; # managed by Certbot
    server_name gna.biodiversite-aura.net;

    # Set maintenance mode
    # Define root paths
    set $base_root_path /home/geostaging/www;
    set $maintenance_root_path $base_root_path/maintenance/atlas;
    # Disable maintenance mode by default
    set $maintenance off;

    # Activate maintenance mode ("long") if file "maintenance.enable" exists
    if (-f $maintenance_root_path/maintenance.enable) {
        set $maintenance on;
        set $maintenance_duration "long";
    }

    # Disable maintenance mode if user browser send a cookie named "maintenance_disable" with a specific UUID value
    if ($cookie_maintenance_disable = "<UUID>") {
        set $maintenance off;
    }

    # Disable maintenance mode for specific IP (default web server IP)
    if ($remote_addr ~ (135.125.89.138)) {
        set $maintenance off;
    }

    # Disable maintenance mode for the URI with the path to the shared CSS, JS, or images used in the maintenance page.
    if ($uri ~ "^/maintenance/(shared|atlas)/") {
        set $maintenance off;
    }

    # Return HTTP code 503 (service unavailable) if maintenance is on
    if ($maintenance = on) {
        return 503;
    }

    error_page 503 @maintenance;

    # Display the long or short term maintenance page.
    location @maintenance {
        root $maintenance_root_path;
        rewrite ^(.*)$ "/maintenance.$maintenance_duration.html" break;
    }

    # Change root path for shared files used in the maintenance page.
    location ~ "^/maintenance/(shared|atlas)/" {
        root $base_root_path;
    }

    location / {
        # Duplication asynchrone vers le sous-traitant Matomo
        mirror /analytics_ai_track;
        mirror_request_body off;

        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WARNING: up timeout to 90s to avoid 502 Bad Gateway response
        # Set timeout like Gunicorn in Taxhub config/settings.ini file
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_pass http://127.0.0.1:58080/;# ATTENTION : bien mettre un slash final ! Sinon => erreur 404
    }

    # Sous-requête interne pour le suivi Matomo
    location = /analytics_ai_track {
        internal;

        # Si ce n'est pas un bot IA, on abandonne immédiatement sans appel sortant
        if ($is_ai_bot = 0) {
            return 204;
        }

        # Résolveur DNS requis pour la résolution de domaines externes dans proxy_pass
        # Utilisation du resolver local de systemd-resolved.
        # Voir /etc/resolv.conf pour trouver l'IP 127.0.0.53.
        # Surveiller le service : systemctl status systemd-resolved.service.
        # Tester le resolver avec : resolvectl query analytics.biodiversite-aura.net
        resolver 127.0.0.53 valid=300s;
        resolver_timeout 3s;

        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # On transmet le User-Agent réel du bot à Matomo
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Paramètres requis par Matomo : rec=1, recMode=1 (no-visit) et url
        # Remplacer id_site=X par l'identifiant (X) du site Matomo correspondant à l'instance de suivi
        proxy_pass https://analytics.biodiversite-aura.net/matomo.php?idsite=3&rec=1&recMode=1&url=$scheme://$host$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/gna.biodiversite-aura.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gna.biodiversite-aura.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;

    server_name gna.biodiversite-aura.net;
    return 302 https://gna.biodiversite-aura.net$request_uri;
}
